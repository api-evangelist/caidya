aid: caidya
name: Caidya
description: 'Caidya is a full-service, global clinical research organization (CRO)
  formed from the April 2021 merger of dMed and Clinipace, rebranded to Caidya in October
  2022. It runs clinical development programs end to end — pre-IND and regulatory strategy,
  early phase, Phase II/III delivery, study start-up, trial feasibility, clinical operations,
  risk-based quality management, medical monitoring, clinical data management, biometrics,
  medical writing, pharmacovigilance, quality assurance and post-marketing surveillance
  — across oncology and hematology, cardiovascular-metabolic, rare disease, pediatrics,
  gastroenterology, nephrology, dermatology, ophthalmology, cell and gene therapy, neurology,
  immunology and infectious disease. The company took a $165M strategic growth investment
  from Rubicon Founders and announced a strategic combination with Simbec-Orion. Caidya
  is a clinical services provider rather than a software vendor: it integrates with sponsor-preferred
  EDC, eCOA, IRT, CTMS, eTMF and safety platforms rather than publishing a developer program
  or a public API of its own.'
